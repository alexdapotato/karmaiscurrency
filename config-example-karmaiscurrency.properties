# Karma Is Currency configuration
# Karma is alignment/progression and is never spent.
kic.configVersion=1

shrines.enabled=true
shrines.preGenerationDiscovery=true
shrines.ringDistance=1000
shrines.ringSpread=100
shrines.shrinesPerRing=8
shrines.ringCount=20
shrines.commandSpawnDefaultRadius=500
shrines.commandSpawnMaxRadius=10000
shrines.commandSpawnMaxAttempts=64
shrines.lightWeight=45
shrines.neutralWeight=35
shrines.darkWeight=20
shrines.minimumDistance=128

# Karma gains: these are full Karma gains/losses. No Karma diminishing returns.
karma.trade=1
karma.tradeBatch=12
karma.cureZombieVillager=4
karma.enderDragon=30
karma.wither=30
karma.villagerKill=5
karma.playerKillBase=10
karma.playerKillMax=25
karma.playerKillVictimBonusDivisor=5
karma.playerKillCooldownMinutes=30
karma.cap=1000
karma.heartThreshold=75
karma.maxBonusHalfHearts=6
karma.decayIntervalMinutes=360
karma.decayPercent=5

# Social currencies: each event has an explicit base social reward.
# Positive/Light actions award Reputation; negative/Dark actions award Infamy.
# Diminishing returns and alignment modifiers apply ONLY to social currency, not Karma.
social.alignedGainPercent=125
social.neutralGainPercent=100
social.opposedGainPercent=75
social.diminishingReturnWindowMinutes=30
social.tradeGain=2
social.villagerKillGain=1
social.cureGain=5
social.enderDragonGain=80
social.witherGain=80
social.playerKillGain=10
social.raidHeroGain=25
social.mercyTrialGain=25
social.protectionTrialGain=10

# Reputation and Infamy decay are disabled by default; set the per-interval value above zero to enable them. Karma naturally decays toward zero while respecting progression floors.
social.reputationDecayIntervalMinutes=120
social.reputationDecayPerInterval=0
social.infamyDecayIntervalMinutes=120
social.infamyDecayPerInterval=0

# Influence Tokens: 100 social currency -> 100 tokens.
# Aligned and Neutral redemption are both 100% by default.
social.materializationPercent=100
social.neutralRedemptionPercent=100
social.alignedRedemptionPercent=100
# Seconds between offering conversions; zero disables the cooldown.
social.dematerializationCooldownSeconds=0

dark.contractCost=25
dark.contractReward=50
dark.contractTarget=10
dark.contractDurationMinutes=60
dark.contractCooldownMinutes=30
dark.curseCooldownMinutes=60
dark.curseRuinCost=50
dark.curseSightCost=100
